<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — Brand Gallery, Краснодар</title>
<meta name="description" content="Каталог итальянской мебели премиум-класса в Краснодаре: диваны, столы, гардеробные, кухни. Фильтр по цене, фабрике и наличию.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/c.css">
</head>
<body>

<main class="wrap">

  <nav class="crumbs" id="ccrumbs"></nav>

  <div class="cat__head">
    <h1 class="t-h1" id="ctitle">Каталог</h1>
    <!-- Переключатель наличия над списком: по словам заказчицы это самый
         нажимаемый элемент каталога. -->
    <div class="stock">
      <button data-stock="all">Все</button>
      <button data-stock="in">В наличии</button>
      <button data-stock="order">Под заказ</button>
    </div>
  </div>

  <!-- Полка марок и есть «страницы фабрик» этого варианта: выбрана одна
       марка — под полкой разворачивается её описание. -->
  <nav class="brandbar" id="brandbar" aria-label="Фабрики"></nav>
  <div class="brandcard" id="brandcard"></div>

  <div class="cat" id="cat">

    <aside>
      <div class="filters" id="filters"></div>
      <button class="fclose" id="fclose">Показать результаты</button>
    </aside>

    <div>
      <div class="toolbar">
        <div style="display:flex;align-items:center;gap:12px">
          <!-- Кнопка телефона: фильтры панелью на весь экран. Колонку
               целиком не прячем — сворачиваются отдельные группы,
               заголовками в самой колонке. -->
          <button class="fopen" id="fopen">Фильтры</button>
          <span class="toolbar__found" id="found"></span>
        </div>
        <div>
          <label class="tiny" for="sort">Сортировка</label>
          <select id="sort">
            <option value="default">по умолчанию</option>
            <option value="stock">сначала в наличии</option>
            <option value="cheap">сначала дешевле</option>
            <option value="rich">сначала дороже</option>
          </select>
        </div>
      </div>

      <!-- Активные условия висят чипами: снять фильтр можно, не открывая
           колонку. На телефоне это единственный способ увидеть, по чему
           отфильтровано. -->
      <div class="chips" id="chips"></div>

      <div class="grid grid--4" id="grid"></div>
    </div>

  </div>

</main>

<script src="../../js/data.js"></script>
<script src="../js/vlib.js"></script>
<script src="js/c.js"></script>
<script src="../../js/pages.js"></script>
<script src="../../js/switch.js"></script>
</body>
</html>
